<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>常旅客入门分享 · 登机牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
  DESIGN SYSTEM — Boarding Pass Deck
  Canvas: fixed 1920×1080, scaled to fit (transform). All sizes in px on the canvas.
  Ticket: 1848×972 at (36,36). Main pass (left) + tear-off coupon (right, 380px).
  Segments (data-seg):  brd 登机 · aln 暖场/联盟 (Y) · upg 升舱正片 (J) · lng 休息室调味 (L) · arr 到达
  Type:  --display Barlow Condensed (numbers/latin headlines)
         --mono    JetBrains Mono (ticket fields, codes, labels)
         --font    PingFang SC (CJK body)
  Accent: --accent switches per segment. Ember = upgrade.
*/
:root {
  --desk: #DDE3EB;
  --desk-dot: rgba(10, 27, 51, 0.07);
  --paper: #FBFCFD;
  --paper-2: #F1F4F8;
  --panel: #FFFFFF;
  --ink: #0F1826;
  --ink-soft: #3A4658;
  --muted: #6E7C90;
  --line: #D7DEE8;
  --line-strong: #A3B1C3;
  --navy: #0A1B33;
  --navy-2: #12294A;
  --on-navy: #E9EEF5;
  --on-navy-muted: #8FA2BA;
  --champagne: #B8975A;
  --champagne-soft: #E9DDC4;
  --ember: #C2562A;
  --ember-soft: #F6E3D8;
  --ow: #8B1E3F;
  --st: #1A6BA5;
  --sa: #9A7B2F;
  --ok: #1F6B4A;
  --accent: var(--champagne);
  --accent-soft: var(--champagne-soft);
  --shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 30px 60px -20px rgba(10,27,51,0.35), 0 8px 18px -8px rgba(10,27,51,0.25);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans SC", system-ui, sans-serif;
  --display: "Barlow Condensed", "DIN Alternate", "Avenir Next Condensed", "PingFang SC", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
[data-theme="dark"] {
  --desk: #04080F;
  --desk-dot: rgba(255, 255, 255, 0.05);
  --paper: #0E1D31;
  --paper-2: #13253D;
  --panel: #172C47;
  --ink: #EDF1F7;
  --ink-soft: #B9C6D7;
  --muted: #8395AC;
  --line: #22385A;
  --line-strong: #3E5A80;
  --navy: #061224;
  --navy-2: #0B1C35;
  --champagne: #D6B97C;
  --champagne-soft: #3A3324;
  --ember: #E8834F;
  --ember-soft: #3E2619;
  --ow: #EC6A86;
  --st: #6BB3E8;
  --sa: #E0B84A;
  --ok: #5ECF9A;
  --shadow: 0 30px 80px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
}
.slide[data-seg="upg"] { --accent: var(--ember); --accent-soft: var(--ember-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  overflow: hidden;
  background: var(--desk);
  background-image: radial-gradient(var(--desk-dot) 1.2px, transparent 1.4px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* —— Fixed 1920×1080 canvas, scaled by JS —— */
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
}
.slide { position: absolute; inset: 0; display: none; }
.slide.active { display: block; animation: slideIn 0.38s cubic-bezier(.2,.7,.2,1); }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* —— Ticket shell —— */
.ticket {
  position: absolute; left: 36px; top: 36px; width: 1848px; height: 960px;
  display: flex;
  filter: drop-shadow(0 26px 40px rgba(10,27,51,0.22)) drop-shadow(0 4px 8px rgba(10,27,51,0.12));
}
[data-theme="dark"] .ticket { filter: drop-shadow(0 30px 50px rgba(0,0,0,0.7)); }
.pass, .coupon {
  position: relative;
  background: var(--paper);
  /* notches at the perforation: cut out with radial masks */
  --notch: 22px;
}
.pass {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  border-radius: 22px 0 0 22px;
  -webkit-mask: radial-gradient(circle var(--notch) at 100% 0, transparent 98%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle var(--notch) at 100% 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle var(--notch) at 100% 0, transparent 98%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle var(--notch) at 100% 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
}
.coupon {
  flex: 0 0 380px;
  border-radius: 0 22px 22px 0;
  background: var(--paper-2);
  -webkit-mask: radial-gradient(circle var(--notch) at 0 0, transparent 98%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle var(--notch) at 0 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle var(--notch) at 0 0, transparent 98%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle var(--notch) at 0 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
  display: flex; flex-direction: column;
  padding: 44px 40px 36px 44px;
}
.coupon::before { /* perforation */
  content: ""; position: absolute; left: 0; top: 34px; bottom: 34px; width: 2px;
  background: repeating-linear-gradient(to bottom, var(--line-strong) 0 7px, transparent 7px 15px);
}

/* —— Pass header (airline strip) —— */
.pass-head {
  flex: 0 0 auto;
  display: flex; align-items: stretch; justify-content: space-between;
  height: 96px; padding: 0 56px;
  border-bottom: 1.5px solid var(--line);
  position: relative;
}
.pass-head::after { /* accent rule */
  content: ""; position: absolute; left: 56px; bottom: -1.5px; width: 120px; height: 3px; background: var(--accent);
}
.brand { display: flex; align-items: center; gap: 16px; }
.brand-mark {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--navy); color: var(--champagne);
  display: grid; place-items: center;
}
[data-theme="dark"] .brand-mark { background: var(--champagne); color: var(--navy); }
.brand-mark svg { width: 24px; height: 24px; }
.brand-name { font-size: 20px; font-weight: 600; letter-spacing: 0.04em; line-height: 1.15; }
.brand-name small { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.22em; margin-top: 3px; }
.head-fields { display: flex; align-items: center; gap: 0; }
.hf { padding: 0 28px; border-left: 1px solid var(--line); }
.hf:first-child { border-left: none; }
.hf-k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
.hf-v { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.05; margin-top: 2px; font-variant-numeric: tabular-nums; }
.hf-v.accent { color: var(--accent); }

.pass-body {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 44px 56px 48px;
  position: relative;
}

/* —— Coupon (stub) —— */
.cp-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.24em; color: var(--muted); }
.cp-route { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.cp-code { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 0.9; letter-spacing: 0.01em; }
.cp-code.to { color: var(--accent); }
.cp-code small { display: block; font-family: var(--font); font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 8px; letter-spacing: 0.08em; }
.cp-plane { flex: 1; height: 2px; margin: 0 14px 26px; position: relative;
  background: repeating-linear-gradient(to right, var(--line-strong) 0 6px, transparent 6px 11px); }
.cp-plane svg { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); color: var(--ink-soft); background: var(--paper-2); padding: 0 3px; box-sizing: content-box; }
.cp-gate { margin-top: 30px; display: flex; align-items: baseline; gap: 10px; }
.cp-gate b { font-family: var(--display); font-size: 168px; font-weight: 800; line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.cp-gate span { font-family: var(--mono); font-size: 18px; color: var(--muted); }
.cp-title { margin-top: 18px; font-size: 22px; font-weight: 600; line-height: 1.35; min-height: 60px; color: var(--ink); }
.cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line-strong); }
.cp-grid .hf-k { font-size: 10px; }
.cp-grid .hf-v { font-size: 24px; }
/* seat map = progress + nav */
.seatmap { margin-top: auto; }
.seatmap .cp-label { display: flex; justify-content: space-between; margin-bottom: 10px; }
.seats { display: grid; grid-template-columns: repeat(3, 1fr) 14px repeat(3, 1fr); gap: 6px; }
.seat {
  appearance: none; border: 0; padding: 0; cursor: pointer;
  height: 20px; border-radius: 5px 5px 3px 3px;
  background: var(--line); opacity: 0.9;
  position: relative;
}
.seat.aisle { visibility: hidden; pointer-events: none; }
.seat[data-seg="upg"] { background: color-mix(in srgb, var(--ember) 28%, var(--line)); }
.seat.past { background: var(--line-strong); }
.seat.past[data-seg="upg"] { background: color-mix(in srgb, var(--ember) 60%, var(--line-strong)); }
.seat[aria-current="true"] { background: var(--ink); outline: 2px solid var(--accent); outline-offset: 2px; }
.seat:hover { opacity: 0.6; }
.seat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.barcode { height: 54px; margin-top: 18px; color: var(--ink); opacity: 0.85; }
.barcode svg { width: 100%; height: 100%; display: block; }

/* —— Shared typography —— */
.eyebrow { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 15px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 18px; }
.eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--accent); }
.eyebrow b { color: var(--accent); font-weight: 700; }
h1 { font-size: 104px; font-weight: 700; line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 64px; font-weight: 700; line-height: 1.12; margin: 0 0 18px; letter-spacing: -0.005em; }
h3 { font-size: 34px; font-weight: 700; line-height: 1.2; margin: 0 0 12px; }
.lead { font-size: 28px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 28px; max-width: 1200px; }
.lead strong, .lead b { color: var(--ink); }
.tiny { font-size: 18px; color: var(--muted); line-height: 1.5; margin: 18px 0 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.grow { flex: 1; min-height: 0; }

/* fare-rule bullets */
.rules { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.rules li {
  counter-increment: r;
  position: relative;
  padding: 20px 0 20px 64px; border-bottom: 1px dashed var(--line-strong);
  font-size: 30px; line-height: 1.45; color: var(--ink);
}
.rules li:first-child { border-top: 1.5px solid var(--ink); }
.rules li::before { content: counter(r, decimal-leading-zero); position: absolute; left: 0; top: 30px; font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--accent); }
.rules strong { color: var(--accent); }

.tag {
  display: inline-block; vertical-align: 4px;
  font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
  padding: 3px 9px; margin-right: 10px; border: 1.5px solid currentColor; border-radius: 4px;
}
.tag-tip, .tag-core { color: var(--ember); }
.tag-exp { color: var(--champagne); }

/* stamp */
.stamp {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  border: 4px solid currentColor; border-radius: 14px; padding: 10px 22px;
  font-family: var(--display); font-weight: 800; letter-spacing: 0.08em; line-height: 1;
  transform: rotate(-8deg); opacity: 0.88; color: var(--ember);
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px currentColor;
}

/* figures */
.fig { position: relative; overflow: hidden; background: var(--paper-2); border-radius: 12px; min-height: 0; cursor: zoom-in; }
.fig img, .fig video { display: block; width: 100%; height: 100%; object-fit: cover; }
.fig.fig-video { cursor: default; background: #050a12; }
.fig.fig-video video { object-fit: contain; }
.fig.fig-contain img { object-fit: contain; }
.cap {
  position: absolute; left: 12px; bottom: 12px; pointer-events: none;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 6px;
  background: rgba(8, 14, 24, 0.72); backdrop-filter: blur(6px);
  color: #F0F3F7; font-size: 16px; font-weight: 500;
}
.cap .code { font-family: var(--mono); font-weight: 700; color: var(--champagne); letter-spacing: 0.06em; }
/* missing originals (HEIC failed to decode → black jpg). Remove data-pending after replacing the file. */
.fig[data-pending] { cursor: default; background:
  repeating-linear-gradient(-45deg, transparent 0 14px, color-mix(in srgb, var(--line-strong) 35%, transparent) 14px 15px), var(--paper-2);
  border: 1.5px dashed var(--line-strong); }
.fig[data-pending] img { display: none; }
.fig[data-pending]::after {
  content: "PHOTO PENDING\A原图待补"; white-space: pre; text-align: center;
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--mono); font-size: 15px; letter-spacing: 0.18em; line-height: 1.8; color: var(--muted);
}
.fig[data-pending] .cap { background: var(--panel); color: var(--ink-soft); border: 1px solid var(--line); backdrop-filter: none; z-index: 1; }

/*PARTS-CSS*/

/* —— Chrome (outside ticket, bottom of canvas) —— */
.chrome {
  position: absolute; left: 36px; right: 36px; bottom: 14px; height: 40px; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 14px; color: var(--muted); letter-spacing: 0.06em;
}
.chrome-group { display: flex; align-items: center; gap: 10px; }
.btn {
  appearance: none; font: inherit; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink);
  height: 30px; padding: 0 14px; border-radius: 15px; font-size: 13px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.counter { font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: 64px; text-align: center; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(4, 8, 14, 0.94); align-items: center; justify-content: center; flex-direction: column; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 84vh; object-fit: contain; border-radius: 8px; }
.lightbox-cap { margin-top: 14px; color: #c8d2de; font-size: 15px; font-family: var(--mono); letter-spacing: 0.06em; }
.lightbox-close { position: absolute; top: 14px; right: 20px; background: transparent; border: none; color: #c8d2de; font-size: 32px; cursor: pointer; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,32,48,0.75); border: 1px solid #4a5f78; color: #e8eef6; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; cursor: pointer; }
.lightbox-nav.prev { left: 20px; } .lightbox-nav.next { right: 20px; }
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="deck" id="deck" role="application" aria-label="常旅客入门分享幻灯片">
<!--SLIDES-->
</div>
<nav class="chrome" aria-label="幻灯片控制">
  <div class="chrome-group">
    <button type="button" class="btn" id="btnPrev" aria-label="上一页">←</button>
    <span class="counter" id="counter" aria-live="polite">01 / 23</span>
    <button type="button" class="btn" id="btnNext" aria-label="下一页">→</button>
    <span>← → / SPACE 翻页 · F 全屏 · 点图放大 · 点座位跳页</span>
  </div>
  <div class="chrome-group">
    <button type="button" class="btn" id="btnTheme">深色</button>
    <button type="button" class="btn" id="btnFs">全屏</button>
  </div>
</nav>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片放大">
  <button type="button" class="lightbox-close" id="lbClose" aria-label="关闭">×</button>
  <button type="button" class="lightbox-nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <img id="lbImg" src="" alt="">
  <button type="button" class="lightbox-nav next" id="lbNext" aria-label="下一张">›</button>
  <div class="lightbox-cap" id="lbCap"></div>
</div>

<script>
(function () {
  const SEG = {
    brd: { code: "BRD", name: "登机", cls: "Y", clsName: "经济舱" },
    aln: { code: "ALN", name: "联盟", cls: "Y", clsName: "经济舱" },
    upg: { code: "UPG", name: "升舱", cls: "J", clsName: "公务舱" },
    lng: { code: "LNG", name: "休息室", cls: "L", clsName: "贵宾厅" },
    arr: { code: "ARR", name: "到达", cls: "Q", clsName: "问答" }
  };
  const ORDER = ["brd", "aln", "upg", "lng", "arr"];
  const PLANE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';
  const pad = (n) => String(n).padStart(2, "0");

  const stage = document.getElementById("stage");
  const slides = Array.from(document.querySelectorAll(".slide"));
  const total = slides.length;

  function barcode(seed) {
    let x = seed * 9301 + 49297, out = "", pos = 0;
    while (pos < 296) {
      x = (x * 9301 + 49297) % 233280;
      const w = 1 + (x % 4), gap = 1 + ((x >> 3) % 3);
      out += '<rect x="' + pos + '" y="0" width="' + w + '" height="54"/>';
      pos += w + gap;
    }
    return '<svg viewBox="0 0 296 54" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">' + out + "</svg>";
  }

  // Wrap each slide's body into the ticket shell
  slides.forEach((s, idx) => {
    const seg = s.dataset.seg || "aln";
    const meta = SEG[seg];
    const segIdx = ORDER.indexOf(seg);
    const prev = SEG[ORDER[Math.max(0, segIdx - 1)]];
    const body = s.querySelector(".pass-body");
    const ticket = document.createElement("div");
    ticket.className = "ticket";
    ticket.innerHTML =
      '<div class="pass">' +
        '<header class="pass-head">' +
          '<div class="brand"><span class="brand-mark">' + PLANE + '</span>' +
          '<div class="brand-name">常旅客入门分享<small>FREQUENT FLYER 101 · 设计组</small></div></div>' +
          '<div class="head-fields">' +
            '<div class="hf"><div class="hf-k">航班 Flight</div><div class="hf-v">FF 2026</div></div>' +
            '<div class="hf"><div class="hf-k">航段 Segment</div><div class="hf-v">' + meta.code + ' · ' + meta.name + '</div></div>' +
            '<div class="hf"><div class="hf-k">舱位 Class</div><div class="hf-v accent">' + meta.cls + ' ' + meta.clsName + '</div></div>' +
            '<div class="hf"><div class="hf-k">登机口 Gate</div><div class="hf-v">' + pad(idx + 1) + '</div></div>' +
          '</div>' +
        '</header>' +
      '</div>' +
      '<aside class="coupon" aria-hidden="false">' +
        '<div class="cp-label">BOARDING PASS · 登机牌</div>' +
        '<div class="cp-route">' +
          '<div class="cp-code">' + (segIdx === 0 ? "YOU" : prev.code) + '<small>' + (segIdx === 0 ? "你" : prev.name) + '</small></div>' +
          '<div class="cp-plane">' + PLANE.replace("<svg", '<svg style="transform:translate(-50%,-50%) rotate(90deg)"') + '</div>' +
          '<div class="cp-code to">' + meta.code + '<small>' + meta.name + '</small></div>' +
        '</div>' +
        '<div class="cp-gate"><b>' + pad(idx + 1) + '</b><span>/ ' + pad(total) + '</span></div>' +
        '<div class="cp-title">' + (s.dataset.title || "") + '</div>' +
        '<div class="cp-grid">' +
          '<div><div class="hf-k">舱位</div><div class="hf-v" style="color:var(--accent)">' + meta.cls + '</div></div>' +
          '<div><div class="hf-k">座位 Seat</div><div class="hf-v">' + (Math.floor(idx / 6) + 1) + "ABCDEF"[idx % 6] + '</div></div>' +
        '</div>' +
        '<div class="seatmap"><div class="cp-label"><span>座位图 · 进度</span><span>' + Math.round(((idx + 1) / total) * 100) + '%</span></div><div class="seats"></div></div>' +
        '<div class="barcode">' + barcode(idx + 7) + '</div>' +
      '</aside>';
    const pass = ticket.querySelector(".pass");
    pass.appendChild(body);
    s.appendChild(ticket);
    // seat map
    const seats = ticket.querySelector(".seats");
    slides.forEach((t, j) => {
      if (j % 6 === 3) { const a = document.createElement("span"); a.className = "seat aisle"; seats.appendChild(a); }
      const b = document.createElement("button");
      b.type = "button"; b.className = "seat" + (j < idx ? " past" : "");
      b.dataset.seg = t.dataset.seg || "aln";
      b.dataset.go = j;
      b.title = pad(j + 1) + " " + (t.dataset.title || "");
      b.setAttribute("aria-label", "跳到第 " + (j + 1) + " 页");
      if (j === idx) b.setAttribute("aria-current", "true");
      seats.appendChild(b);
    });
  });

  // Scale canvas to viewport
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + s + ") translate(-50%, -50%)";
  }
  window.addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", fit);
  fit();

  const counter = document.getElementById("counter");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnTheme = document.getElementById("btnTheme");
  const btnFs = document.getElementById("btnFs");
  const root = document.documentElement;
  let i = 0;

  function applyTheme(t) {
    if (t === "light") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", "dark");
    try { localStorage.setItem("ff-share-theme", t); } catch (e) {}
    btnTheme.textContent = t === "dark" ? "浅色" : "深色";
  }
  let saved = null;
  try { saved = localStorage.getItem("ff-share-theme"); } catch (e) {}
  applyTheme(saved === "light" || saved === "dark" ? saved : "light");

  function show(n) {
    stage.querySelectorAll("video").forEach((v) => { try { v.pause(); } catch (e) {} });
    i = Math.max(0, Math.min(total - 1, n));
    slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
    counter.textContent = pad(i + 1) + " / " + pad(total);
    btnPrev.disabled = i === 0;
    btnNext.disabled = i === total - 1;
    document.title = (slides[i].dataset.title || "") + " · 常旅客入门分享";
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  const next = () => show(i + 1), prev = () => show(i - 1);
  function toggleFs() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);
  btnTheme.addEventListener("click", () => applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  btnFs.addEventListener("click", toggleFs);

  // Lightbox
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCap");
  let gallery = [], gi = 0;
  const usable = (f) => f.querySelector("img") && !f.hasAttribute("data-pending") && !f.classList.contains("fig-video");
  function renderLb() {
    const fig = gallery[gi]; if (!fig) return;
    const img = fig.querySelector("img"), cap = fig.querySelector(".cap");
    lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt || "";
    lbCap.textContent = cap ? cap.textContent : "";
  }
  function openLb(fig) {
    const name = fig.dataset.gallery;
    gallery = name ? Array.from(document.querySelectorAll('.fig[data-gallery="' + name + '"]')).filter(usable) : [fig];
    gi = Math.max(0, gallery.indexOf(fig));
    renderLb(); lb.classList.add("open");
  }
  const closeLb = () => { lb.classList.remove("open"); gallery = []; };
  const lbStep = (d) => { if (!gallery.length) return; gi = (gi + d + gallery.length) % gallery.length; renderLb(); };

  document.getElementById("deck").addEventListener("click", (e) => {
    const seat = e.target.closest(".seat[data-go]");
    if (seat) { show(+seat.dataset.go); return; }
    const fig = e.target.closest(".fig");
    if (fig && usable(fig)) { openLb(fig); return; }
    if (e.target.closest("video, button, a, .fig")) return;
    const r = stage.getBoundingClientRect();
    const rel = (e.clientX - r.left) / r.width;
    if (rel > 0.62) next(); else if (rel < 0.38) prev();
  });
  document.getElementById("lbClose").addEventListener("click", closeLb);
  document.getElementById("lbNext").addEventListener("click", (e) => { e.stopPropagation(); lbStep(1); });
  document.getElementById("lbPrev").addEventListener("click", (e) => { e.stopPropagation(); lbStep(-1); });
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });

  document.addEventListener("keydown", (e) => {
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowRight") lbStep(1);
      else if (e.key === "ArrowLeft") lbStep(-1);
      e.preventDefault(); return;
    }
    if (e.target && e.target.tagName === "VIDEO" && e.key === " ") return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { e.preventDefault(); show(0); }
    else if (e.key === "End") { e.preventDefault(); show(total - 1); }
    else if (e.key === "f" || e.key === "F") toggleFs();
  });

  let touchX = null;
  document.addEventListener("touchstart", (e) => { if (!lb.classList.contains("open")) touchX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchX == null || lb.classList.contains("open")) return;
    const dx = e.changedTouches[0].screenX - touchX; touchX = null;
    if (Math.abs(dx) >= 50) (dx < 0 ? next : prev)();
  }, { passive: true });

  const start = parseInt(location.hash.slice(1), 10);
  show(Number.isFinite(start) ? start - 1 : 0);
})();
</script>
</body>
</html>
